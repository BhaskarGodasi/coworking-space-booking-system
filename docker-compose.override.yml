services:
  db:
    ports:
      - "5432:5432"

  backend:
    build:
      target: builder
    command: npm run dev
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    environment:
      NODE_ENV: development

  frontend:
    build:
      target: builder
    command: npm run dev -- --host
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    ports:
      - "5173:5173"
