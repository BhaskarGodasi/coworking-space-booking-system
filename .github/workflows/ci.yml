name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coworking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coworking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coworking_test
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
      JWT_EXPIRES_IN: 15m
      REFRESH_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Type check backend
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run backend migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Build backend
        working-directory: backend
        run: npm run build

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build-images:
    name: Build Docker images
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t coworking-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t coworking-frontend:${{ github.sha }} ./frontend

      # Docker & DevOps v1.1's CI/CD section documents pushing to a
      # container registry and triggering an SSH deployment. Both require
      # registry/server credentials that only exist as repository secrets
      # once an operator configures them for a real target environment --
      # these steps are gated on that secret being present so the workflow
      # is complete per the documented pipeline without failing in a repo
      # that has not yet been given a deployment target.
      - name: Log in to registry
        if: ${{ secrets.REGISTRY_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Push images to registry
        if: ${{ secrets.REGISTRY_PASSWORD != '' }}
        run: |
          docker tag coworking-backend:${{ github.sha }} ${{ secrets.REGISTRY_URL }}/coworking-backend:${{ github.sha }}
          docker tag coworking-frontend:${{ github.sha }} ${{ secrets.REGISTRY_URL }}/coworking-frontend:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_URL }}/coworking-backend:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_URL }}/coworking-frontend:${{ github.sha }}

      - name: Trigger deployment
        if: ${{ secrets.DEPLOY_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: cd /opt/coworking && docker compose pull && docker compose up -d
